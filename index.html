    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandboxed iframe dev environment
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event && event.filename && event.filename.includes('@vite/client')) ||
            (event && event.message && (event.message.includes('WebSocket') || event.message.includes('vite-hmr')))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          var reason = event && event.reason;
          var msg = String((reason && reason.message) || reason || '');
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('vite-hmr')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
